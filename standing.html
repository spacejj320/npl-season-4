<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPL Season 6 Standings</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #6e0028;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px 16px 40px;
        }
        h1 {
            color: #FED941;
            margin: 8px 0 20px;
            font-size: clamp(30px, 4vw, 52px);
            letter-spacing: 0.08em;
        }
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            font-size: 18px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgb(0 0 0 / 0.45);
        }
        th, td {
            border: 1px solid #383838;
            padding: 10px 12px;
            color: #fff;
        }
        th {
            background: #1f1f1f;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        td {
            background-color: #121212;
            font-size: 16px;
            text-align: left;
        }
        input {
            font-size: 16px;
            padding: 8px 6px;
            background-color: #1d1d1d;
            color: #fff;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            text-align: center;
            width: 100%;
        }
        input:focus {
            outline: none;
            border-color: #FED941;
            box-shadow: 0 0 0 2px rgb(254 217 65 / 0.25);
        }
        button {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.03em;
            padding: 8px 14px;
            background-color: #FED941;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        button:hover {
            background-color: #fff;
            color: #222;
        }
        .main-th th {
            font-size: 16px;
        }
        .pool-label {
            font-weight: bold;
            background: #0d0d0d;
            color: #FED941;
            text-align: left;
            font-size: 18px;
            letter-spacing: 0.05em;
        }
        tbody tr:not(.pool-label-row):hover td {
            background: #1c1c1c;
        }
        .toolbar {
            width: 90%;
            margin: 0 auto 10px;
            display: flex;
            justify-content: flex-end;
        }
        td:first-child {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>NPL SEASON 6</h1>
    <div class="toolbar">
        <button onclick="sortTable()">Sort Table</button>
    </div>
    <table border="1" id="scoreTable">
        <thead>
            <tr class="main-th">
                <th>Team Name</th>
                <th>M</th>
                <th>W</th>
                <th>L</th>
                <th>D</th>
                <th>GD</th>
                <th>Points</th>
                <th>Save</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const teams = {
            'GROUP A': ['SANNADHASENA', 'WONDER HOME FC', 'MINT FC', 'OZO FC'],
            'GROUP B': ['QATAR FC', 'GREEK MEN FC', 'SANAM FC', 'NKP WARRIORS']
        };
        const TEAM_ORDER_KEY = 'teamOrderByPool';

        function getTeamOrderByPool() {
            return JSON.parse(localStorage.getItem(TEAM_ORDER_KEY)) || {};
        }

        function getPoolTeamsInSavedOrder(poolName) {
            const savedOrderByPool = getTeamOrderByPool();
            const defaultTeams = teams[poolName];
            const savedOrder = savedOrderByPool[poolName];

            if (!Array.isArray(savedOrder) || savedOrder.length !== defaultTeams.length) {
                return defaultTeams;
            }

            const hasExactTeams = defaultTeams.every(team => savedOrder.includes(team));
            return hasExactTeams ? savedOrder : defaultTeams;
        }

        function saveTeam(row, name) {
            const matches = parseInt(row.cells[1].children[0].value);
            const won = parseInt(row.cells[2].children[0].value);
            const lost = parseInt(row.cells[3].children[0].value);
            const draw = parseInt(row.cells[4].children[0].value);
            const goalDifference = parseInt(row.cells[5].children[0].value);
            const points = won * 3 + draw;
            row.cells[6].children[0].value = points;

            const teamData = JSON.parse(localStorage.getItem('teams')) || {};
            teamData[name] = { matches, won, lost, draw, goalDifference, points };
            localStorage.setItem('teams', JSON.stringify(teamData));
        }

        function addEventListenersToRow(row) {
            Array.from(row.getElementsByTagName('input')).forEach((input, index) => {
                // Auto-save on every value edit (except computed points field).
                if (index !== 5) {
                    input.addEventListener('input', function () {
                        saveTeam(row, row.cells[0].textContent);
                    });
                }
                input.addEventListener('keypress', function (event) {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        saveTeam(row, row.cells[0].textContent);
                    }
                });
            });
        }

        function displayTeams() {
            const storedTeams = JSON.parse(localStorage.getItem('teams')) || {};
            const tbody = document.getElementById('scoreTable').getElementsByTagName('tbody')[0];
            tbody.innerHTML = '';

            for (let pool in teams) {
                const labelRow = tbody.insertRow();
                labelRow.classList.add('pool-label-row');
                const labelCell = labelRow.insertCell(0);
                labelCell.colSpan = 8;
                labelCell.className = 'pool-label';
                labelCell.textContent = pool;

                const poolTeams = getPoolTeamsInSavedOrder(pool);
                poolTeams.forEach(team => {
                    const data = storedTeams[team] || { matches: 0, won: 0, lost: 0, draw: 0, goalDifference: 0, points: 0 };
                    const row = tbody.insertRow();
                    row.setAttribute('data-team', team);
                    row.setAttribute('data-pool', pool);
                    row.insertCell(0).textContent = team;
                    Object.values(data).forEach((value, index) => {
                        const input = document.createElement('input');
                        input.type = 'number';
                        input.value = value;
                        if (index === 5) {
                            input.readOnly = true;
                        }
                        row.insertCell(index + 1).appendChild(input);
                    });
                    const saveBtn = document.createElement('button');
                    saveBtn.textContent = 'Save';
                    saveBtn.onclick = function () { saveTeam(row, team); };
                    row.insertCell(7).appendChild(saveBtn);
                    addEventListenersToRow(row);
                });
            }
        }

        function sortTable() {
            const tbody = document.getElementById('scoreTable').getElementsByTagName('tbody')[0];
            const allRows = Array.from(tbody.rows);

            const pools = {};
            let currentPool = null;

            allRows.forEach(row => {
                if (row.classList.contains('pool-label-row')) {
                    currentPool = row.cells[0].textContent.trim();
                    pools[currentPool] = [];
                } else if (currentPool) {
                    pools[currentPool].push(row);
                }
            });

            tbody.innerHTML = '';

            const sortedOrderByPool = {};

            for (let pool in pools) {
                const labelRow = document.createElement('tr');
                labelRow.classList.add('pool-label-row');
                const labelCell = document.createElement('td');
                labelCell.colSpan = 8;
                labelCell.className = 'pool-label';
                labelCell.textContent = pool;
                labelRow.appendChild(labelCell);
                tbody.appendChild(labelRow);

                const sortedRows = pools[pool].sort((a, b) => {
                    const pointsA = parseInt(a.cells[6].children[0].value);
                    const gdA = parseInt(a.cells[5].children[0].value);
                    const pointsB = parseInt(b.cells[6].children[0].value);
                    const gdB = parseInt(b.cells[5].children[0].value);
                    return pointsB - pointsA || gdB - gdA;
                });

                sortedOrderByPool[pool] = sortedRows.map(row => row.getAttribute('data-team'));
                sortedRows.forEach(row => tbody.appendChild(row));
            }

            localStorage.setItem(TEAM_ORDER_KEY, JSON.stringify(sortedOrderByPool));
        }

        window.onload = displayTeams;
    </script>
</body>
</html>
